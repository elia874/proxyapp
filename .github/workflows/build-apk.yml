name: Build APK

# Builds a debug APK whenever you push to main, or manually via the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      # Debug APK is fine for our own testing (no signing needed to install
      # via "unknown sources"). Switch to `flutter build apk --release`
      # once the app is stable and you want a smaller/faster build.

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxyapp-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
