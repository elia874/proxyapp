name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Project Configurations
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.elia874.proxyapp --project-name proxyapp_flutter
          fi

      - name: Fetch Target Dependencies
        run: flutter pub get

      - name: Compile Debug APK
        run: flutter build apk --debug

      - name: Export APK File
        uses: actions/upload-artifact@v4
        with:
          name: proxyapp-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
